<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GenLayer Spinner — Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0b0f1a;
      color: #e8eaf6;
    }
    .card { text-align: center; }
    .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 24px; margin: 24px 0; }
    .tag { margin: 8px 0 0; font-size: 12px; color: #8b93b3; }
  </style>
</head>
<body>
  <div class="card">
    <p>Standalone SVG (32px, 64px, 128px)</p>
    <div class="sizes">
      <div><img src="public/genlayer-spinner.svg" width="32" height="32" alt="Loading" /><p class="tag">32px</p></div>
      <div><img src="public/genlayer-spinner.svg" width="64" height="64" alt="Loading" /><p class="tag">64px</p></div>
      <div><img src="public/genlayer-spinner.svg" width="128" height="128" alt="Loading" /><p class="tag">128px</p></div>
    </div>
  </div>
</body>
</html>
